<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>La Via Perduta — testi delle tavole</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#2b2722;color:#eee;display:flex;height:100vh;overflow:hidden}
  #lista{width:110px;overflow-y:auto;background:#1f1c18;padding:6px}
  #lista button{display:block;width:100%;margin:0 0 4px;padding:6px;border:0;border-radius:4px;background:#3a342c;color:#eee;cursor:pointer;font-size:14px}
  #lista button.on{background:#c79a4b;color:#111;font-weight:bold}
  #lista button .n{float:right;font-size:11px;opacity:.8}
  #centro{flex:1;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:10px}
  #barra{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  #barra button{padding:6px 14px;border:0;border-radius:4px;background:#3a342c;color:#eee;cursor:pointer;font-size:16px}
  #stato{font-size:13px;opacity:.75;min-width:120px}
  #pagina{position:relative;display:inline-block;cursor:crosshair;line-height:0}
  #pagina img{height:calc(100vh - 70px);width:auto;display:block;user-select:none}
  .pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#e0412b;color:#fff;font:bold 13px/26px system-ui;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px #0008;cursor:pointer}
  .pin.sel{background:#2b7de0}
  #note{width:360px;overflow-y:auto;background:#1f1c18;padding:10px}
  #note h3{margin:4px 0 10px;font-size:15px;color:#c79a4b}
  .nota{background:#332e27;border-radius:6px;padding:8px;margin-bottom:8px;border:2px solid transparent}
  .nota.sel{border-color:#2b7de0}
  .nota .num{display:inline-block;width:22px;height:22px;border-radius:50%;background:#e0412b;color:#fff;text-align:center;font:bold 12px/22px system-ui;margin-right:6px}
  .nota select,.nota textarea,.nota input{width:100%;margin-top:5px;background:#1f1c18;color:#eee;border:1px solid #555;border-radius:4px;padding:5px;font-size:14px;font-family:inherit}
  .nota textarea{height:70px;resize:vertical}
  .nota .riga{display:flex;gap:6px}
  .nota .riga select{flex:1}
  .nota .del{float:right;background:none;border:0;color:#e88;cursor:pointer;font-size:13px}
  .vuoto{opacity:.6;font-size:14px}
</style>
</head>
<body>
<div id="lista"></div>
<div id="centro">
  <div id="barra">
    <button id="prev">◀</button><b id="titolo"></b><button id="next">▶</button>
    <span id="stato"></span>
  </div>
  <div id="pagina"><img id="img" alt=""></div>
</div>
<div id="note"><h3>Testi di questa tavola</h3><div id="elenco"></div>
  <p class="vuoto">Clicca un punto della tavola per aggiungere un testo. Si salva da solo.</p></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://vsjthriabitepaztnpic.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzanRocmlhYml0ZXBhenRucGljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMDMyNTIsImV4cCI6MjA5NTc3OTI1Mn0.cNNcYwx2GN9whs0rscdCFnVc8QUwr-i6J6bn8-o4S8U');
const T = 'commenti_lettering';
const CHI = ['Narratore','Vivenna','Loras','Drull','Thalyssra','Tobias','Rhogan','Xona','Serenthil','Dorvan','Vagabondo','Capitano','Soldato','Ribelle','Oste','Erborista','Rumore','Altro'];
const TIPI = ['balloon','didascalia','pensiero','sussurro','urlo','rumore'];
let tavole = [], i = 0, note = [], sel = null, conteggi = {};
const $ = id => document.getElementById(id);
const stato = t => { $('stato').textContent = t; };

async function init(){
  tavole = await (await fetch('tavole.json')).json();
  const h = location.hash.replace('#','');
  if (tavole.includes(h)) i = tavole.indexOf(h);
  await contaTutte(); disegnaLista(); apri();
}
async function contaTutte(){
  const { data } = await sb.from(T).select('tavola');
  conteggi = {}; (data||[]).forEach(r => conteggi[r.tavola] = (conteggi[r.tavola]||0)+1);
}
function disegnaLista(){
  $('lista').innerHTML = tavole.map((t,k)=>`<button class="${k===i?'on':''}" data-k="${k}">${t}<span class="n">${conteggi[t]||''}</span></button>`).join('');
  $('lista').querySelectorAll('button').forEach(b=>b.onclick=()=>{i=+b.dataset.k;apri();});
}
async function apri(){
  const t = tavole[i]; location.hash = t; sel = null;
  $('titolo').textContent = 'Tavola ' + t; $('img').src = 'tavole/tav-' + t + '.jpg';
  disegnaLista(); stato('caricamento…');
  const { data, error } = await sb.from(T).select('*').eq('tavola', t).order('created_at');
  if (error) { stato('errore: ' + error.message); return; }
  note = data || []; disegna(); stato('');
}
function disegna(){
  document.querySelectorAll('.pin').forEach(p=>p.remove());
  note.forEach((n,k)=>{
    const p = document.createElement('div'); p.className = 'pin' + (sel===n.id?' sel':'');
    p.style.left = (n.x*100)+'%'; p.style.top = (n.y*100)+'%'; p.textContent = k+1;
    p.onclick = e => { e.stopPropagation(); seleziona(n.id); };
    $('pagina').appendChild(p);
  });
  $('elenco').innerHTML = note.map((n,k)=>`
    <div class="nota ${sel===n.id?'sel':''}" data-id="${n.id}">
      <span class="num">${k+1}</span><button class="del">elimina</button>
      <div class="riga">
        <select class="chi">${CHI.map(c=>`<option ${c===n.chi?'selected':''}>${c}</option>`).join('')}</select>
        <select class="tipo">${TIPI.map(c=>`<option ${c===n.tipo?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <textarea class="testo" placeholder="Scrivi il testo…">${(n.testo||'').replace(/</g,'&lt;')}</textarea>
    </div>`).join('');
  $('elenco').querySelectorAll('.nota').forEach(d=>{
    const id = d.dataset.id;
    d.onclick = () => { if (sel!==id) seleziona(id, false); };
    d.querySelector('.chi').onchange = e => { salva(id,{chi:e.target.value}); if(e.target.value==='Narratore') aggiorna(id,'didascalia',d); if(e.target.value==='Rumore') aggiorna(id,'rumore',d); };
    d.querySelector('.tipo').onchange = e => salva(id,{tipo:e.target.value});
    let tm; d.querySelector('.testo').oninput = e => { stato('…'); clearTimeout(tm); tm=setTimeout(()=>salva(id,{testo:e.target.value}),700); };
    d.querySelector('.del').onclick = async ev => { ev.stopPropagation(); if(!confirm('Eliminare questo testo?')) return;
      await sb.from(T).delete().eq('id',id); note = note.filter(n=>n.id!==id); conteggi[tavole[i]]--; disegna(); disegnaLista(); stato('eliminato'); };
  });
}
function aggiorna(id,tipo,d){ d.querySelector('.tipo').value = tipo; salva(id,{tipo}); }
function seleziona(id, focus=true){
  sel = id; disegna();
  const d = document.querySelector(`.nota[data-id="${id}"]`);
  if (d){ d.scrollIntoView({block:'nearest'}); if(focus) d.querySelector('.testo').focus(); }
}
async function salva(id, campi){
  const n = note.find(x=>x.id===id); Object.assign(n, campi);
  const { error } = await sb.from(T).update({...campi, updated_at:new Date().toISOString()}).eq('id',id);
  stato(error ? 'errore: '+error.message : 'salvato ✓');
}
$('pagina').onclick = async e => {
  const r = $('img').getBoundingClientRect();
  const x = (e.clientX - r.left)/r.width, y = (e.clientY - r.top)/r.height;
  stato('salvataggio…');
  const { data, error } = await sb.from(T).insert({tavola:tavole[i], x, y, chi:'Narratore', tipo:'didascalia', testo:''}).select().single();
  if (error) { stato('errore: '+error.message); return; }
  note.push(data); conteggi[tavole[i]]=(conteggi[tavole[i]]||0)+1; disegnaLista(); seleziona(data.id); stato('salvato ✓');
};
$('prev').onclick = () => { if(i>0){i--;apri();} };
$('next').onclick = () => { if(i<tavole.length-1){i++;apri();} };
document.addEventListener('keydown', e => { if (e.target.tagName==='TEXTAREA') return;
  if (e.key==='ArrowLeft') $('prev').click(); if (e.key==='ArrowRight') $('next').click(); });
init();
</script>
</body>
</html>
