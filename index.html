<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>La Via Perduta — testi delle tavole</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#2b2722;color:#eee;font-family:system-ui,Segoe UI,Arial,sans-serif}
  #barra{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;justify-content:center;padding:6px;background:#1f1c18}
  #barra button,#barra select{padding:6px 12px;border:0;border-radius:4px;background:#3a342c;color:#eee;font-size:16px}
  #stato{font-size:12px;opacity:.75;min-width:70px}
  #centro{display:flex;justify-content:center;padding:6px}
  #pagina{position:relative;line-height:0;max-width:100%}
  #pagina img{display:block;max-width:100%;max-height:calc(100vh - 60px);width:auto;height:auto;user-select:none;-webkit-user-select:none}
  .pin{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:#e0412b;color:#fff;font:bold 12px/24px system-ui;text-align:center;border:2px solid #fff;box-shadow:0 1px 4px #0009;cursor:pointer;z-index:2}
  .pin.on{background:#2b7de0}
  #editor{position:absolute;z-index:3;width:min(260px,80vw);background:rgba(25,22,18,.82);backdrop-filter:blur(2px);border:1px solid #c79a4b;border-radius:8px;padding:8px;line-height:normal;display:none}
  #editor select,#editor textarea{width:100%;background:rgba(0,0,0,.35);color:#fff;border:1px solid #666;border-radius:4px;padding:5px;font-size:15px;font-family:inherit}
  #editor .riga{display:flex;gap:6px;margin-bottom:6px}
  #editor .riga select{flex:1}
  #editor textarea{height:80px;resize:vertical}
  #editor .bottoni{display:flex;justify-content:space-between;margin-top:6px}
  #editor button{border:0;border-radius:4px;padding:6px 14px;font-size:15px;cursor:pointer}
  #ok{background:#c79a4b;color:#111;font-weight:bold}
  #del{background:none;color:#f99}
</style>
</head>
<body>
<div id="barra">
  <button id="prev">◀</button>
  <select id="scelta"></select>
  <button id="next">▶</button>
  <span id="stato"></span>
</div>
<div id="centro">
  <div id="pagina">
    <img id="img" alt="">
    <div id="editor">
      <div class="riga"><select id="chi"></select><select id="tipo"></select></div>
      <textarea id="testo" placeholder="Scrivi il testo…"></textarea>
      <div class="bottoni"><button id="del">elimina</button><button id="ok">OK</button></div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://vsjthriabitepaztnpic.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzanRocmlhYml0ZXBhenRucGljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMDMyNTIsImV4cCI6MjA5NTc3OTI1Mn0.cNNcYwx2GN9whs0rscdCFnVc8QUwr-i6J6bn8-o4S8U');
const T = 'commenti_lettering';
const CHI = ['Narratore','Vivenna','Loras','Drull','Thalyssra','Tobias','Rhogan','Xona','Serenthil','Dorvan','Vagabondo','Capitano','Soldato','Ribelle','Oste','Erborista','Rumore','Altro'];
const TIPI = ['balloon','didascalia','pensiero','sussurro','urlo','rumore'];
const $ = id => document.getElementById(id);
let tavole = [], i = 0, note = [], aperta = null, conteggi = {}, timer;
const stato = t => $('stato').textContent = t;
$('chi').innerHTML = CHI.map(c=>`<option>${c}</option>`).join('');
$('tipo').innerHTML = TIPI.map(c=>`<option>${c}</option>`).join('');

async function init(){
  tavole = await (await fetch('tavole.json', {cache:'no-store'})).json();
  const h = location.hash.replace('#','');
  if (tavole.includes(h)) i = tavole.indexOf(h);
  const { data } = await sb.from(T).select('tavola');
  (data||[]).forEach(r => conteggi[r.tavola] = (conteggi[r.tavola]||0)+1);
  apri();
}
function menu(){
  $('scelta').innerHTML = tavole.map((t,k)=>`<option value="${k}" ${k===i?'selected':''}>Tavola ${t}${conteggi[t]?' ('+conteggi[t]+')':''}</option>`).join('');
}
async function apri(){
  chiudi(); const t = tavole[i]; location.hash = t; menu();
  $('img').src = 'tavole/tav-' + t + '.jpg'; stato('…');
  const { data, error } = await sb.from(T).select('*').eq('tavola', t).order('created_at');
  if (error) { stato('errore'); alert(error.message); return; }
  note = data || []; pins(); stato('');
}
function pins(){
  document.querySelectorAll('.pin').forEach(p=>p.remove());
  note.forEach((n,k)=>{
    const p = document.createElement('div');
    p.className = 'pin' + (aperta===n.id?' on':''); p.textContent = k+1;
    p.style.left = n.x*100+'%'; p.style.top = n.y*100+'%';
    p.onclick = e => { e.stopPropagation(); aperta===n.id ? chiudi() : mostra(n); };
    $('pagina').appendChild(p);
  });
}
function mostra(n){
  aperta = n.id; pins();
  const ed = $('editor'); ed.style.display = 'block';
  $('chi').value = n.chi || 'Narratore'; $('tipo').value = n.tipo || 'balloon'; $('testo').value = n.testo || '';
  const W = $('pagina').clientWidth, H = $('pagina').clientHeight;
  let x = n.x*W + 16, y = n.y*H + 16;
  if (x + ed.offsetWidth > W) x = n.x*W - ed.offsetWidth - 16;
  if (y + ed.offsetHeight > H) y = n.y*H - ed.offsetHeight - 16;
  ed.style.left = Math.max(0,x)+'px'; ed.style.top = Math.max(0,y)+'px';
  $('testo').focus();
}
function chiudi(){ aperta = null; $('editor').style.display = 'none'; pins(); }
async function salva(campi){
  const n = note.find(x=>x.id===aperta); if (!n) return; Object.assign(n, campi); stato('…');
  const { error } = await sb.from(T).update({...campi, updated_at:new Date().toISOString()}).eq('id', n.id);
  stato(error ? 'errore' : 'salvato ✓');
}
$('chi').onchange = e => { const c = e.target.value;
  if (c==='Narratore') $('tipo').value='didascalia'; if (c==='Rumore') $('tipo').value='rumore';
  salva({chi:c, tipo:$('tipo').value}); };
$('tipo').onchange = e => salva({tipo:e.target.value});
$('testo').oninput = e => { stato('…'); clearTimeout(timer); timer = setTimeout(()=>salva({testo:e.target.value}), 600); };
async function conferma(){ clearTimeout(timer); const t = $('testo').value.trim();
  if (!t) { await sb.from(T).delete().eq('id', aperta); note = note.filter(n=>n.id!==aperta); conteggi[tavole[i]]--; menu(); chiudi(); stato(''); return; }
  await salva({testo:$('testo').value}); chiudi(); }
$('ok').onclick = async e => { e.stopPropagation(); await conferma(); };
$('del').onclick = async e => { e.stopPropagation(); if (!confirm('Eliminare questo testo?')) return;
  await sb.from(T).delete().eq('id', aperta); note = note.filter(n=>n.id!==aperta);
  conteggi[tavole[i]]--; menu(); chiudi(); stato('eliminato'); };
$('editor').onclick = e => e.stopPropagation();
$('img').onclick = async e => {
  if (aperta) { await conferma(); return; }
  const r = $('img').getBoundingClientRect();
  const x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
  stato('…');
  const { data, error } = await sb.from(T).insert({tavola:tavole[i], x, y, chi:'Narratore', tipo:'didascalia', testo:''}).select().single();
  if (error) { stato('errore'); alert(error.message); return; }
  note.push(data); conteggi[tavole[i]] = (conteggi[tavole[i]]||0)+1; menu(); mostra(data); stato('salvato ✓');
};
$('scelta').onchange = e => { i = +e.target.value; apri(); };
$('prev').onclick = () => { if (i>0){ i--; apri(); } };
$('next').onclick = () => { if (i<tavole.length-1){ i++; apri(); } };
document.addEventListener('keydown', e => { if (['TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if (e.key==='ArrowLeft') $('prev').click(); if (e.key==='ArrowRight') $('next').click(); });
init();
</script>
</body>
</html>
